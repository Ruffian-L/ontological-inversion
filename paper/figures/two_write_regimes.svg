<rect x="55" y="470" width="1015" height="72" rx="12" fill="#fff8e9" stroke="#d87918" stroke-width="2"/>
<text x="75" y="500" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#d87918">Same existence result, different rate–distortion point</text>
<text x="75" y="525" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#172033">Compact steering changes a semantic basin; ordered high-bandwidth slots preserve identity, relation, and usable propositions.</text>
<text x="48" y="575" font-family="DejaVu Sans,Arial,sans-serif" font-size="10.5" fill="#5b6475">Sources: ontological-inversion run cards; niodoo-live soft-slot, oracle, contextual-use, and inference transcripts.</text>
