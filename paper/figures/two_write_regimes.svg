<text x="660.0" y="176" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#5b6475">shipped Synapse</text>
<rect x="805" y="112" width="250" height="92" rx="12" fill="#f7f9fc" stroke="#2463eb" stroke-width="2"/>
<text x="930.0" y="149" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">Qwen2.5-0.5B · layer 4</text>
<text x="930.0" y="176" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#5b6475">sign-sensitive object basin</text>
